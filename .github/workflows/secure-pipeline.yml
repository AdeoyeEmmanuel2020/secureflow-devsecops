name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  security-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

        uses: hashicorp/setup-terraform@v3- - name: Setup Terraform
  uses: hashicorp/setup-terraform@v3
  with:
    terraform_version: 1.6.2

      - name: Terraform Init
        run: terraform -chdir=terraform init

        run: terraform -chdir=terraform fmt -check - name: Terraform Format
  run: terraform -chdir=terraform fmt -recursive

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Run tfsec Security Scan
        run: tfsec terraform/

      - name: Run Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
