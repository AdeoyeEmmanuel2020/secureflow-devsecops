name: SecureFlow assurance pipeline

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/secure-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/secure-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: secureflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-assurance:
    name: Terraform and policy assurance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Initialise without backend
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Enforce canonical formatting
        run: terraform -chdir=terraform fmt -check -recursive -diff

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate -no-color

      - name: Scan configuration with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy findings
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Evaluate policy with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: CKV_AWS_109,CKV_AWS_111,CKV_AWS_356,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_62
